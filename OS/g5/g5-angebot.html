        +(t.st==='geboten'?'<p class="hinweis">Das Gebot ist abgegeben.</p>':'<div class="g5a-akt"><button class="btn primaer" onclick="g5aAbgabe(\''+t.id+'\')">Gebot abgeben</button><button class="btn geist" onclick="g5aAkt(\''+t.id+'\',\'unsig\')">Unterschrift zurückziehen</button></div><p class="hinweis">Die Abgabe erfolgt über das Vergabeportal der Vergabestelle. Jede Änderung an Anschreiben oder Konzept hebt die Unterschrift auf.</p>');
    } else if(r.ok){
      h+='<div class="g5a-sig"><div>'+esc(BIETER.stadt)+', den '+tag(0)+'</div><div class="g5a-linie">'+esc(BIETER.gf)+' · '+esc(BIETER.rolle)+'</div></div>'
        +'<div class="g5a-akt"><button class="btn primaer" onclick="g5aSign(\''+t.id+'\')">Unterzeichnen</button></div><p class="hinweis">Mit der Unterschrift bestätigt die Geschäftsführung Preis, Konzept und Erklärungen. Verbindlich wird das Angebot erst mit der Abgabe im Vergabeportal.</p>';
    } else {
      h+='<div class="g5a-urteil '+(r.rot?'rot':'gelb')+'"><b>Noch nicht unterschriftsreif.</b> '+(r.rot?'Mindestens ein Prüfpunkt verhindert die Abgabe.':'Es fehlt noch eine Entscheidung.')+'</div><div class="g5a-akt"><button class="btn" onclick="g5aTab(\''+t.id+'\',\'check\')">Zur Prüfung ›</button></div>';
    }
    return h;
  }
  function koerper(t){
    var a=stand(t.id);
    if(a.tab==='check') return checkHtml(t);
    if(a.tab==='brief') return '<textarea class="g5a-text" id="g5a-brief" oninput="g5aEdit(\''+t.id+'\',\'brief\',this.value)">'+esc(text(t,'brief'))+'</textarea><div class="g5a-akt"><button class="btn geist" onclick="g5aNeu(\''+t.id+'\',\'brief\')">Text neu aus den Ausschreibungsdaten erzeugen</button></div>';
    if(a.tab==='preis') return preisHtml(t);
    if(a.tab==='konz') return '<textarea class="g5a-text hoch" id="g5a-konz" oninput="g5aEdit(\''+t.id+'\',\'konz\',this.value)">'+esc(text(t,'konz'))+'</textarea><div class="g5a-akt"><button class="btn" onclick="g5aKi(\''+t.id+'\')">Anschreiben und Konzept von der KI schreiben lassen</button><button class="btn geist" onclick="g5aNeu(\''+t.id+'\',\'konz\')">Text neu aus den Ausschreibungsdaten erzeugen</button></div>';
    if(a.tab==='unt') return untHtml(t);
    if(a.tab==='pers') return persHtml(t);
    if(a.tab==='erkl') return erklHtml(t);
    return sigHtml(t);
  }
  function zeichne(id){
    var t=tender(id); if(!t) return; var a=stand(id), r=reif(t);
    var d=document.getElementById('g5ang');
    if(!d){ d=document.createElement('div'); d.className='gdeck'; d.id='g5ang'; d.addEventListener('click',function(ev){ if(ev.target===d) g5aZu(); }); document.body.appendChild(d); }
    var ampel=a.sig?'<span class="tag gruen">unterzeichnet</span>':r.ok?'<span class="tag gruen">unterschriftsreif</span>':r.rot?'<span class="tag rot">nicht abgabereif</span>':'<span class="tag ex">'+r.gelb+' offen</span>';
    d.innerHTML='<div class="gglas g5a"><h3>Angebot '+esc(t.id)+' '+ampel+'<button class="gx" onclick="g5aZu()">×</button></h3>'
      +'<p class="g5a-sub">'+esc(t.titel)+' · '+esc(t.tr)+' · Abgabe bis '+esc(fristText(t))+'</p>'
      +'<div class="tab-bar">'+TABS.filter(function(x){ return x[0]!=='unt'||t.link; }).map(function(x){ return '<button class="'+(a.tab===x[0]?'an':'')+'" onclick="g5aTab(\''+id+'\',\''+x[0]+'\')">'+x[1]+'</button>'; }).join('')+'</div>'
      +'<div class="g5a-k">'+koerper(t)+'</div>'
      +'<div class="g5a-fuss"><button class="btn geist" onclick="g5aDruck(\''+id+'\')">Mappe drucken / PDF</button><button class="btn geist" onclick="g5aDatei(\''+id+'\')">Mappe herunterladen</button><button class="btn geist" onclick="g5aZu()">Schließen</button></div></div>';
    d.classList.add('auf');
  }
  function mappe(t){
    var a=stand(t.id), pre=function(s){ return '<div style="white-space:pre-wrap;line-height:1.55">'+esc(s)+'</div>'; };
    return '<h1>Angebot '+esc(t.id)+'</h1><p>'+esc(t.titel)+' · '+esc(t.tr)+' · Abgabe bis '+esc(fristText(t))+'</p>'
      +'<h2>1 Anschreiben</h2>'+pre(text(t,'brief'))+'<h2>2 Preisblatt</h2>'+preisHtml(t).split('<h4>Interne Kalkulation')[0].replace('<h4>Preisblatt</h4>','')
      +'<h2>3 Durchführungskonzept</h2>'+pre(text(t,'konz'))+'<h2>4 Personal und Referenzen</h2>'+persHtml(t)+'<h2>5 Erklärungen und Nachweise</h2>'+erklHtml(t)
      +'<h2>6 Unterschrift</h2>'+(a.sig?'<p>Unterzeichnet von '+esc(a.sig.name)+', '+esc(BIETER.rolle)+', am '+esc(a.sig.zeit)+'.<br>Prüfsumme: '+esc(a.sig.hash)+'</p>':'<p>'+esc(BIETER.stadt)+', den '+tag(0)+'</p><p style="margin-top:48px;border-top:1px solid #000;width:300px;padding-top:4px">'+esc(BIETER.gf)+' · '+esc(BIETER.rolle)+'</p>');
  }
  function protokoll(wer,was,det){ var g=vg(); try{ if(g&&g.log) g.log(wer,was,det); }catch(e){} }
  function liste(){ var g=vg(); try{ if(g&&g.neu) g.neu(); }catch(e){} }

  /* ---------- Aktionen ---------- */
  window.g5aZu=function(){ var d=document.getElementById('g5ang'); if(d) d.classList.remove('auf'); };
  window.g5aTab=function(id,k){ stand(id).tab=k; zeichne(id); };
  window.g5aEdit=function(id,k,v){ var a=stand(id); a.texte[k]=v; if(a.sig){ a.sig=null; if(window.toast) toast('Text geändert. Die Unterschrift ist aufgehoben.'); } };
  window.g5aNeu=function(id,k){ var a=stand(id); a.texte[k]=null; a.sig=null; zeichne(id); };
  window.g5aAkt=function(id,was){
    var a=stand(id), t=tender(id);
    if(was==='holen'){ g5aHolen(id,true); return; }
    if(was==='imp'){ a.imp=true; a.texte.konz=null; protokoll('KAȲȲA','Vergabeunterlagen importiert',id+' · '+anforderungen(t).length+' Anforderungen erkannt'); }
    else if(was==='unsig'){ a.sig=null; }
    else if(was.indexOf('ok:')===0){ a.ok[was.slice(3)]=true; protokoll(BIETER.gf+' (GF)','Prüfpunkt bestätigt',id+' · '+was.slice(3)); }
    zeichne(id);
  };
  window.g5aSign=function(id){
    var t=tender(id), a=stand(id); if(!t||!reif(t).ok) return;
    var roh=mappe(t), fertig=function(h){ a.sig={name:BIETER.gf, zeit:new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}), hash:h};
      protokoll(BIETER.gf+' (GF)','Angebot unterzeichnet',id+' · Prüfsumme '+h); zeichne(id); if(window.toast) toast('Unterzeichnet. Das Gebot kann abgegeben werden.'); };
    try{ crypto.subtle.digest('SHA-256',new TextEncoder().encode(roh)).then(function(b){ fertig(Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join('').slice(0,24)); },function(){ fertig('nicht berechnet'); }); }
    catch(e){ fertig('nicht berechnet'); }
  };
  window.g5aAbgabe=function(id){ var a=stand(id); if(!a.sig) return; if(window.__g5goAlt) window.__g5goAlt(id); g5aZu(); };
  /* ---------- Online: Ausschreibung holen, Preis setzen, Texte von der KI ---------- */
  window.g5aHolen=function(id,neu){
    var t=tender(id), a=stand(id); if(!t||!t.link||a.laedt) return;
    a.laedt=true; a.fehler=''; zeichne(id);
    fetch('/vergabe-import.php?url='+encodeURIComponent(t.link.replace(/#.*$/,''))+(neu?'&neu=1':''),{cache:'no-store'})
      .then(function(r){ return r.json().catch(function(){ return {error:'Antwort nicht lesbar ('+r.status+')'}; }); })
      .then(function(j){
        a.laedt=false;
        if(!j||!j.ok){ a.fehler=(j&&j.error)||'keine Antwort'; }
        else { a.live=j; a.texte={}; a.sig=null; var d=j.daten||{};
          if(d.titel) t.titel=d.titel; if(d.vergabestelle&&d.vergabestelle.name) t.tr=d.vergabestelle.name;
          if(d.teilnehmerplaetze) t.pl=d.teilnehmerplaetze; if(d.leistungsort) t.reg=d.leistungsort;
          var n=tageBis(d.angebotsfrist); if(n!=null) t.off=n; var z=zahlen(t); if(z.erl){ t.vol=z.erl; t.rent='+5,0 %'; }
          protokoll('KAȲȲA','Ausschreibung online geholt',(d.vergabenummer||id)+' · '+(j.auswertung==='ki'?'KI-Auswertung':'Auswertung nach Regeln')+' · '+((d.einzureichen||[]).length)+' Unterlagen verlangt');
          liste(); }
        var o=document.getElementById('g5ang'); if(o&&o.classList.contains('auf')) zeichne(id);
      })
      .catch(function(){ a.laedt=false; a.fehler='Server nicht erreichbar'; zeichne(id); });
  };
  window.g5aSatz=function(id,v){ var a=stand(id), n=Math.round(+v); if(!(n>=100&&n<=20000)) return; a.satz=n; a.ok.preis=false; a.texte.brief=null; a.sig=null; var t=tender(id), z=zahlen(t); if(z.erl) t.vol=z.erl; liste(); zeichne(id); };
  function traegerFakten(t){
    var p=PROFIL[profilKey(t)], z=zahlen(t), zl=zulassung(t), l=L(t);
    return 'Bieter: '+BIETER.name+', '+BIETER.str+', '+BIETER.ort+'. Unterzeichner: '+BIETER.gf+', '+BIETER.rolle+'. Ort und Datum des Schreibens: '+BIETER.stadt+', '+tag(0)+'.\n'
      +(zl?'Zulassung: '+zl+'.\n':'Keine Trägerzulassung für diese Leistungsart; Eignung über Referenzen.\n')
      +'Vorgesehenes Personal: '+p.pers.map(function(k){ return PERS[k][0]+' ('+PERS[k][1]+', '+PERS[k][2]+')'; }).join('; ')+'.\n'
      +'Eigene Räume: '+p.raum+'.\n'
      +'Laufende Referenzmaßnahmen: '+(referenzen(t).map(function(r){ return r.join(', '); }).join(' | ')||'keine in dieser Leistungsart')+'.\n'
      +(z.erl?'Angebotspreis: '+eur(z.erl)+(z.jeMonat?' ('+eur(z.jeMonat)+' je Teilnehmerplatz und Monat)':'')+'.\n':'Angebotspreis: noch nicht festgelegt.\n')
      +'Bindefrist: bis '+bindeText(t)+'.\n'
      +'Arbeitsweise: tägliche Anwesenheit per Check-in, Lernstand je Kompetenz, eigene App für Teilnehmende in mehreren Sprachen, Frühwarnsignale bei drohendem Abbruch mit sozialpädagogischer Begleitung, Lese-Zugang für den Auftraggeber mit tagesaktueller Belegung, Anwesenheit und Belegkette, revisionssichere Dokumentation.\n'
      +'Fachlicher Ansatz: '+p.inhalt+' '+p.erfolg;
  }
  window.g5aKiText=function(id){
    var t=tender(id), a=stand(id); if(!t||a.kiLaeuft) return; var l=L(t), z=zahlen(t);
    var daten=l?l.daten:{titel:t.titel, vergabenummer:t.id, vergabestelle:{name:t.tr}, leistung:PROFIL[profilKey(t)].n+'. '+PROFIL[profilKey(t)].ziel, rechtsgrundlage:PROFIL[profilKey(t)].recht, leistungsort:t.reg, lose:t.los, teilnehmerplaetze:z.pl, laufzeit_monate:z.dauer, angebotsfrist:tag(t.off), bindefrist:tag(t.off+60), anforderungen:anforderungen(t), einzureichen:[{unterlage:'Anschreiben'},{unterlage:'Preisblatt'},{unterlage:'Durchführungskonzept'},{unterlage:'Eigenerklärungen'},{unterlage:'Nachweise'}]};
    a.kiLaeuft=true; if(window.toast) toast('Die KI schreibt Anschreiben und Konzept auf diese Ausschreibung. Das dauert bis zu einer Minute.');

    fetch('/vergabe-import.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aktion:'entwurf',daten:daten,traeger:traegerFakten(t)})})
      .then(function(r){ return r.json().catch(function(){ return {error:'Antwort nicht lesbar ('+r.status+')'}; }); })
      .then(function(j){ a.kiLaeuft=false;
        if(j&&j.ok&&j.konzept&&j.konzept.length>300){ a.texte.brief=j.anschreiben; a.texte.konz=j.konzept; a.sig=null; a.kiText=true; protokoll('KAȲȲA-KI','Anschreiben und Konzept geschrieben',id); if(window.toast) toast('Anschreiben und Konzept sind neu geschrieben. Bitte gegenlesen.'); }
        else if(window.toast) toast('Die KI ist nicht verfügbar: '+((j&&j.error)||'keine Antwort')+'. Der vorbereitete Text bleibt.');
        var o=document.getElementById('g5ang'); if(o&&o.classList.contains('auf')) zeichne(id); })
      .catch(function(){ a.kiLaeuft=false; if(window.toast) toast('Die KI ist nicht erreichbar. Der vorbereitete Text bleibt.'); zeichne(id); });
  };
  window.g5aKi=window.g5aKiText;

  /* ---------- Echte Ausschreibungen im Vergabe-Monitor (service.bund.de, live) ---------- */
  var ECHT={sw:'Eingliederung', items:[], laedt:false, stand:'', fehler:''};
  var SUCH=['Eingliederung','Aktivierung','Qualifizierung','Bildung','Sprachkurs','Pflege','Coaching','Jugendhilfe'];
  function echtZeichne(){
    var box=document.getElementById('g5echt'); if(!box) return;
    var h='<div class="k-titel">Echte Ausschreibungen <span class="tag gruen">live · service.bund.de</span></div>'
      +'<div class="hinweis" style="margin-bottom:10px">Aktuelle Bekanntmachungen öffentlicher Auftraggeber. „Angebot erstellen“ holt die Bekanntmachung und die Vergabeunterlagen online und baut daraus die Angebotsmappe.</div>'
      +'<div class="m-row" style="margin-bottom:8px">'+SUCH.map(function(s){ return '<button class="btn '+(ECHT.sw===s?'primaer':'geist')+'" onclick="g5aSuche(\''+s+'\')">'+s+'</button>'; }).join('')+'</div>';
    if(ECHT.laedt) h+='<p class="hinweis">Suche läuft …</p>';
    else if(ECHT.fehler) h+='<p class="hinweis">'+esc(ECHT.fehler)+'</p>';
    else if(!ECHT.items.length) h+='<p class="hinweis">Keine laufenden Bekanntmachungen zu diesem Stichwort.</p>';
    else h+=ECHT.items.map(function(x,i){ var n=tageBis(x.frist), g=vg(), drin=g&&g.T.some(function(y){ return y.link===x.link; });
      return '<div class="zeile" style="align-items:flex-start;gap:12px"><div style="flex:1;min-width:0"><div class="zn">'+esc(x.titel)+'</div><div class="zf">'+esc(x.stelle)+' · Frist '+esc(x.frist||'–')+(n!=null?' · noch '+n+' Tage':'')+'</div></div>'
        +(x.link?'<button class="btn '+(drin?'geist':'gold')+'" onclick="g5aEcht('+i+')">'+(drin?'Angebotsmappe öffnen':'Angebot erstellen')+'</button>':'')+'</div>'; }).join('')
      +'<p class="hinweis" style="margin-top:8px">Stand '+esc(ECHT.stand)+'</p>';
    box.innerHTML=h;
  }
  window.g5aSuche=function(sw){
    ECHT.sw=sw; ECHT.laedt=true; ECHT.fehler=''; echtZeichne();
    fetch('/foerder-proxy.php?q=bund&sw='+encodeURIComponent(sw),{cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){ ECHT.laedt=false; ECHT.items=(j&&j.items||[]).filter(function(x){ return /service\.bund\.de\/IMPORTE\/Ausschreibungen\//.test(x.link||''); }); ECHT.stand=(j&&j.stand)||''; if(j&&j.error) ECHT.fehler='service.bund.de antwortet gerade nicht.'; echtZeichne(); })
      .catch(function(){ ECHT.laedt=false; ECHT.fehler='service.bund.de antwortet gerade nicht.'; echtZeichne(); });
  };
  window.g5aEcht=function(i){
    var x=ECHT.items[i], g=vg(); if(!x||!g) return; var link=x.link.replace(/#.*$/,'');
    var t=g.T.filter(function(y){ return y.link===x.link||y.link===link; })[0];
    if(!t){ var nr=(link.match(/\/([A-Za-z0-9]+)\.html$/)||[])[1]||String(Date.now()).slice(-6), n=tageBis(x.frist);
      t={id:'SB-'+nr, titel:x.titel, tr:x.stelle, los:'Öffentliche Ausschreibung · service.bund.de', reg:'—', pl:'–', off:(n!=null?n:21), vol:0, pass:70, rent:'± offen', emp:'pruefen', st:'angebot', open:false, kap:'zu prüfen', link:link,
        beweis:'Echte Ausschreibung. Kein eigenes Referenzlos hinterlegt.', warum:'Von service.bund.de übernommen. Preis, Personal und Standort bestätigt die Geschäftsführung in der Angebotsmappe.'};
      g.T.push(t); protokoll(BIETER.gf+' (GF)','Echte Ausschreibung übernommen',t.id+' · '+String(x.titel).slice(0,70)); liste(); }
    stand(t.id).tab='check'; zeichne(t.id); if(!stand(t.id).live) g5aHolen(t.id); echtZeichne();
  };
  function echtEinbau(){
    if(document.getElementById('g5echt')) return true; var liste0=document.getElementById('m-tlist'); if(!liste0) return false;
    var k=document.createElement('div'); k.className='karte'; k.id='g5echt'; k.style.marginBottom='18px'; liste0.parentNode.insertBefore(k,liste0);
    echtZeichne(); g5aSuche(ECHT.sw); return true;
  }
  var ei=setInterval(function(){ if(vg()&&echtEinbau()) clearInterval(ei); },600);
  window.g5aDatei=function(id){
    var t=tender(id); if(!t) return;
    var blob=new Blob(['<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Angebot '+esc(t.id)+'</title><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:760px;margin:40px auto;color:#111;font-size:14px}h1{font-size:24px}h2{font-size:17px;margin-top:28px;border-bottom:1px solid #999;padding-bottom:4px}h4{margin:16px 0 6px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccc;padding:6px 8px;text-align:left;font-size:13px}.hinweis{color:#555;font-size:12.5px}.g5a-p{display:none}.tag{font-size:11px;border:1px solid #999;border-radius:99px;padding:1px 8px}</style></head><body>'+mappe(t)+'</body></html>'],{type:'text/html'});
    var l=document.createElement('a'); l.href=URL.createObjectURL(blob); l.download='Angebot-'+t.id+'.html'; l.click(); setTimeout(function(){ URL.revokeObjectURL(l.href); },500);
  };
  window.g5aDruck=function(id){
    var t=tender(id); if(!t) return; var p=document.getElementById('g5druck');
    if(!p){ p=document.createElement('div'); p.id='g5druck'; document.body.appendChild(p); }
    p.innerHTML=mappe(t); document.documentElement.classList.add('g5-druck');
    var weg=function(){ document.documentElement.classList.remove('g5-druck'); window.removeEventListener('afterprint',weg); };
    window.addEventListener('afterprint',weg); window.print(); setTimeout(weg,1500);
  };

  /* ---------- Einhängen in den Vergabe-Monitor ---------- */
  function haenge(){
    if(!vg()||!window.m_draft||window.__g5ang) return; window.__g5ang=1;
    window.__g5goAlt=window.m_go;
    window.m_draft=function(id){ var t=tender(id); if(!t) return; t.st='angebot'; t.open=true; stand(id).tab='check';
      protokoll('KAȲȲA (Entwurf)','Angebotsmappe erstellt',id+' · Anschreiben, Preisblatt, Konzept, Personal, Erklärungen'); liste(); zeichne(id); };
    window.m_unterlage=function(id){ zeichne(id); };
    window.m_go=function(id){ var a=stand(id); if(a.sig){ window.__g5goAlt(id); return; } a.tab=reif(tender(id)).ok?'sig':'check'; zeichne(id); if(window.toast) toast('Ein Gebot geht erst nach der Unterschrift der Geschäftsführung hinaus.'); };
  }
  var hi=setInterval(function(){ haenge(); if(window.__g5ang) clearInterval(hi); },400);
})();
