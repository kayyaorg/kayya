   ['fib',/Bank-Anbindung · Status/,[['Stand','Dieser Baustein ist technisch vorbereitet und wird mit der Freischaltung durch die Bank aktiv.'],['Bis dahin','Zahlungsdateien werden erzeugt und von Hand ins Bankprogramm übernommen.']],null],
   ['kl',/hat vorgearbeitet/,[['Entwurf','KAȲȲA hat den Entwurf aus Anwesenheit, Lernstand und deinen Notizen erstellt.'],['Regel','Nichts geht ohne deine Freigabe hinaus. Du kannst jeden Satz ändern.']],null],

   ['tn',/Deine Daten/,[['Deine Entscheidung','Einwilligungen kannst du jederzeit widerrufen. Der Widerruf wirkt sofort.'],['Löschung','Nach Ablauf der Aufbewahrungsfristen wird die Löschung vorgeschlagen und nach Freigabe durchgeführt.']],null],
   ['tn',/Krankmeldung/,[['Meldung','Deine Krankmeldung ist mit Datum und Uhrzeit gespeichert.'],['Wer informiert ist','Kursleitung und Träger. Die Meldung an den Kostenträger bereitet KAȲȲA vor, der Träger gibt sie frei.']],null],
   ['tn',/Reha heute|Vitalwerte/,[['Gesundheitsdaten','Diese Angaben liegen in einem getrennten Datenraum. Zugriff hat nur das therapeutische Team.'],['Kostenträger','Der Kostenträger sieht keine Einzelwerte.']],null],

   ['ag',/Warum das zählt/,[['Hintergrund','Das Zeugnis trägt ein elektronisches Siegel. Jede nachträgliche Änderung macht die Prüfung ungültig.']],null],

  function e2(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function frei(z){ return !z.querySelector('button,a,input,select,textarea') && !z.getAttribute('onclick') && !z.closest('[onclick]'); }
  function regel(z){ var sec=z.closest('section.view'); if(!sec) return null; var v=sec.id.slice(2); var k=z.closest('.karte'); if(!k) return null;
    var kt=k.querySelector('.k-titel'); var t=kt?(kt.innerText||'').replace(/\s+/g,' ').trim():''; if(!t) return null;
    for(var i=0;i<R.length;i++){ if((R[i][0]==='*'||R[i][0]===v) && R[i][1].test(t)) return R[i]; } return null; }
  function zu(){ var d=document.getElementById('g5det'); if(d) d.classList.remove('auf'); }

    if((document.documentElement.getAttribute('lang')||'de')!=='de') return;

    var st=z.querySelector('.tag'); var status=st?st.textContent.trim():'';
    var d=document.getElementById('g5det');
    if(!d){ d=document.createElement('div'); d.className='gdeck'; d.id='g5det'; d.addEventListener('click',function(e){ if(e.target===d) zu(); }); document.body.appendChild(d); }
    var f=r[2].slice(); if(ang) f.unshift(['Angabe',ang]);
    d.innerHTML='<div class="gglas" style="max-width:600px"><h3>'+e2(titel)+'<button class="gx" onclick="g5zu()">×</button></h3>'
      +(status?'<p><span class="tag rw">'+e2(status)+'</span></p>':'')

      +'<button class="btn geist" onclick="g5zu()">Schließen</button></div></div>';
    d.classList.add('auf');

  function markiere(){ document.querySelectorAll('section.view .zeile:not([data-g5i])').forEach(function(z){

      if(frei(z) && getComputedStyle(z).cursor!=='pointer' && regel(z)) z.classList.add('g5info','g5klick'); }); }
