});

var netzTmp=[];
function netzZeigen(k){
  netzWeg();

    if(K.a!==k&&K.b!==k) return;
    var A=beiK(K.a),B=beiK(K.b);
    var mx0=(A.x+B.x)/2,my0=(A.y+B.y)/2;
    var dx=mx0-YX,dy=my0-YY,dl=Math.sqrt(dx*dx+dy*dy)||1;
    var p=el('path',{d:'M'+A.x+' '+A.y+' Q'+(mx0+dx/dl*30).toFixed(1)+' '+(my0+dy/dl*30).toFixed(1)+' '+B.x+' '+B.y,'class':'mnetz'+(K.t==='rw'?'':' ro')});
    netzLage.appendChild(p); netzTmp.push(p);
    var andere=(K.a===k?K.b:K.a);
    if(bubbles[andere]) bubbles[andere].classList.add('an');
  });
  if(bubbles[k]) bubbles[k].classList.add('an');
}
function netzWeg(){
  netzTmp.forEach(function(p){ p.remove(); }); netzTmp=[];
  ROLLEN.forEach(function(R){ if(bubbles[R.k]) bubbles[R.k].classList.remove('an'); });
}

function lade(i){
  var Q=QUELLEN[i]; if(!Q.q) return;

  url+='&size=5';

  }).catch(function(){});
}
