<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wartungsübersicht</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
:root{ --bg:#FAFAF7; --ink:#141414; --mut:#6B6B66; --line:#E3E1DA; --card:#FFFFFF;
  --akz:#4D004D; --rot:#B3261E; --gelb:#9A6A00; --gruen:#1E7B4D; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#131312; --ink:#ECEAE4; --mut:#95938C; --line:#2B2B28; --card:#1A1A18;
    --akz:#D9A8D9; --rot:#FF7A70; --gelb:#E8B94A; --gruen:#4CC98A; }
}
:root[data-theme="dark"]{ --bg:#131312; --ink:#ECEAE4; --mut:#95938C; --line:#2B2B28; --card:#1A1A18;
  --akz:#D9A8D9; --rot:#FF7A70; --gelb:#E8B94A; --gruen:#4CC98A; }
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--ink)}
body{font:15px/1.5 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 22px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap;gap:10px}
.marke{font-size:17px;font-weight:800}.marke b{color:var(--akz)}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:2px}
.kopfr{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--mut)}
.kopfr a:hover,.kopfr span[onclick]:hover{color:var(--ink);cursor:pointer}
.kopfr select{width:auto;padding:3px 6px;font-size:12px;border-radius:7px;background:var(--bg);color:var(--mut);border:1px solid var(--line);cursor:pointer}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin-bottom:10px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:6px}
.crumb a{color:var(--akz)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px;border-top:1px solid var(--line);padding-top:14px}
.karte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.karte.klick{cursor:pointer;transition:border-color .15s}
.karte.klick:hover{border-color:var(--akz)}
.zeile{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hinweis{font-size:12.5px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--mut)}
.tag.rot{color:var(--rot);border-color:var(--rot)}
.tag.gelb{color:var(--gelb);border-color:var(--gelb)}
.tag.gruen{color:var(--gruen);border-color:var(--gruen)}
.tag.akz{color:var(--akz);border-color:var(--akz)}
.btn{display:inline-block;font-size:13px;font-weight:600;border-radius:9px;padding:8px 14px;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--akz);color:var(--akz)}
.btn.voll{background:var(--ink);color:var(--bg)}
.btn.voll:hover{background:var(--akz);border-color:var(--akz);color:#fff}
.btn.mini{font-size:12px;padding:5px 10px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:110px}
label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{font-weight:800;font-size:22px}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 2px}
.kpis>div{min-width:110px}
.mang{border-left:3px solid var(--line);padding:10px 14px;margin-bottom:10px}
.mang.wes{border-left-color:var(--rot)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#deck{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
#deck.an{display:flex}
#deck .glas{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:620px;width:100%}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13.5px;border-radius:10px;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw}
#toast.an{opacity:1}
.ladend{opacity:.55;pointer-events:none}
@media (max-width:640px){ .kpis{gap:14px} td,th{padding:7px 5px} }
@media print{ header,.btn,#toast{display:none!important} }
#immobg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity .6s;pointer-events:none}
.zrk{margin-bottom:12px;display:inline-block}
</style>
</head>

function upload(aid){

  fd.append('action','upload'); fd.append('token',TOK); fd.append('anlage_id',aid);
  fd.append('typ',$('up-t').value); fd.append('pruefart_id',$('up-p').value); fd.append('datei',f);
  $('up-go').classList.add('ladend'); $('up-go').textContent=t('lädt …');
  fetch('/wartung-api.php',{method:'POST',body:fd}).then(function(r){ return r.json(); }).then(function(j){
    if(j&&j.ok){ toast(t('Hochgeladen — jetzt „✳ Auslesen" klicken.')); vAnlage(aid); }
    else toast((j&&j.error)||t('Upload fehlgeschlagen.'));

   +'<label>'+t('Ausführende Firma')+'</label><input id="fb-f">'
   +'<div class="mrow"><button class="btn voll" onclick="fBehobenOk('+id+')">'+t('Speichern')+'</button><button class="btn" onclick="deckZu()">'+t('Abbrechen')+'</button></div>');
}
function fBehobenOk(id){
  api({action:'mangel_status',id:id,status:'behoben',behoben_am:$('fb-d').value,firma:$('fb-f').value},function(j){ if(j&&j.ok){ deckZu(); toast(t('Behoben — jetzt die Mangelfreimeldung erstellen.')); vAnlage(AKT.id); } });

function vergabe(mid){

  api({action:'vergabe',mangel_id:mid},function(j){
    if(!j){ deckZu(); return; }
    deckAuf('<h2>'+t('Vergabeempfehlung · Gewerk:')+' '+esc(j.gewerk)+'</h2>'
     +'<label>'+t('Passende Firmen')+'</label><div class="hinweis" style="margin-bottom:8px">'+(j.firmen.length?j.firmen.map(function(f){ return '<b>'+esc(f.name)+'</b> · '+esc(f.kontakt||''); }).join('<br>'):t('Noch keine Firma für dieses Gewerk hinterlegt.'))+'</div>'

function fAngebot(mid){
  deckAuf('<h2>'+t('Angebot bewerten')+'</h2><label>'+t('Firma')+'</label><input id="ag-f"><label>'+t('Angebotssumme (€ brutto)')+'</label><input id="ag-b" type="number" step="0.01">'
   +'<label>'+t('Leistungsbeschreibung (kurz)')+'</label><textarea id="ag-t"></textarea>'

function fAngebotOk(mid){

  deckAuf('<h2>'+t('✳ KAȲȲA bewertet …')+'</h2><div class="hinweis">'+t('Preisspanne, Einordnung, Empfehlung — dauert einen Moment.')+'</div>');
  api({action:'angebot_bewerten',mangel_id:mid,betrag:b,firma:f,beschreibung:tx},function(j){
    if(!j){ deckZu(); return; }
    deckAuf('<h2>'+t('Angebotsbewertung')+'</h2><div style="font-size:14px;white-space:pre-wrap">'+esc(j.bewertung)+'</div>'
     +'<div class="mrow"><button class="btn voll" onclick="deckZu();vAnlage(AKT.id)">'+t('Übernehmen')+'</button></div>');
  });

/* Die Mangelfreimeldung bleibt bewusst deutsch — offizielles Schreiben an die Prüforganisation. */
function freimeldung(mid){
  api({action:'freimeldung',mangel_id:mid},function(m){
    if(!m) return;
    var heute=new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
    var aw=null; try{ aw=JSON.parse(m.auswertung||'null'); }catch(e){}
    var html='<h1 style="margin-bottom:2px">Mangelfreimeldung · Bestätigung der Mängelbeseitigung</h1>'
     +'<div style="color:#555;margin-bottom:18px">gemäß Prüfbericht'+(aw&&aw.berichtsnr?' Nr. '+esc(aw.berichtsnr):'')+(aw&&aw.pruefstelle?' · '+esc(aw.pruefstelle):'')+(m.orig_name?' ('+esc(m.orig_name)+')':'')+'</div>'
     +'<table width="100%" cellpadding="6" style="border-collapse:collapse;font-size:13px" border="1">'
     +'<tr><td width="30%" style="background:#f2f5f7"><b>Objekt</b></td><td>'+esc(m.immobilie)+' · '+esc(m.adresse||'')+'</td></tr>'
     +'<tr><td style="background:#f2f5f7"><b>Anlage</b></td><td>'+esc(m.anlage)+' ('+esc(m.typ||'')+(m.hersteller?', '+esc(m.hersteller):'')+(m.baujahr?', Bj. '+esc(m.baujahr):'')+')'+(m.standort?' · '+esc(m.standort):'')+'</td></tr>'
     +'<tr><td style="background:#f2f5f7"><b>Festgestellter Mangel</b></td><td>'+esc(m.text)+'<br><i>'+(+m.wesentlich===1?'wesentlicher Mangel':'unwesentlicher Mangel')+'</i></td></tr>'
     +'<tr><td style="background:#f2f5f7"><b>Beseitigung</b></td><td>behoben am <b>'+dstr(m.behoben_am||new Date().toISOString().slice(0,10))+'</b>'+(m.firma?' durch <b>'+esc(m.firma)+'</b>':'')+'</td></tr>'
     +'</table>'
     +'<p style="font-size:13px;margin-top:16px">Hiermit wird bestätigt, dass der oben bezeichnete, im Prüfbericht festgestellte Mangel fach- und sachgerecht beseitigt wurde. Die Anlage befindet sich in ordnungsgemäßem Zustand. Nachweise (Rechnung / Arbeitsbericht der ausführenden Firma) liegen vor und können auf Anforderung übermittelt werden.</p>'
     +'<div style="margin-top:30px;font-size:13px">Berlin, den '+heute
     +'<div style="margin-top:34px;border-top:1px solid #333;width:280px;padding-top:4px;font-size:12px">Bernhard Krug · Geschäftsführung<br>Betreiber / Hausverwaltung</div></div>';
    var blob=new Blob(['<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Mangelfreimeldung</title></head><body style="font-family:Segoe UI,Arial,sans-serif;max-width:760px;margin:40px auto;color:#111" onload="window.print()">'+html+'</body></html>'],{type:'text/html'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Mangelfreimeldung-'+m.id+'.html'; a.click(); URL.revokeObjectURL(a.href);
    toast(t('Mangelfreimeldung erzeugt — unterschreiben und an die Prüforganisation senden.'));
  });
}

/* ---------- Router ---------- */
function route(){
  if(!TOK){ vLogin(); return; }
  if(!WER){ api({action:'me'},function(j){ if(j){ WER=j; kopf(); route(); } }); return; }
  kopf();
  var h=location.hash.replace('#/','');
  if(h.indexOf('immo/')!==0) immoBildAus();
  if(h.indexOf('immo/')===0) vImmo(h.slice(5));
  else if(h.indexOf('anlage/')===0) vAnlage(h.slice(7));
  else vDash();
}
window.addEventListener('hashchange',route);
kopfSprache();
route();
</script>
